# Memory framework schema (29 items).
#
# Each entry describes one extraction target. The actual extraction prompt
# lives in `config/prompts/memory_items/<id>.md` and is editable in the UI.
#
# Fields:
#   id:            stable identifier used in code and JSON state
#   title:         Korean display name shown in UI
#   category:      grouping for the table view (Korean)
#   output_fields: keys that the LLM must return in its JSON response
#                  (always includes "Status"; other fields vary per item)

items:
  - id: "01_occupation"
    title: "직업 및 주요 활동"
    category: "환경 및 사회적 기능"
    output_fields: [Status, OccupationSnapshot, CriticalCareerEvent]

